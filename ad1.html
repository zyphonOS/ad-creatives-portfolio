<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0E1013; }
  .ad {
    width: 1080px; height: 1080px; position: relative; overflow: hidden;
    background: radial-gradient(1200px 800px at 85% -10%, #1A1D24 0%, #0E1013 55%);
    font-family: Georgia, 'Times New Roman', serif; color: #F5EFE0;
    padding: 84px 80px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .topline {
    font-family: system-ui, -apple-system, sans-serif; font-size: 30px; letter-spacing: 0.42em;
    text-transform: uppercase; color: #C9A227; font-weight: 600;
  }
  .headline { font-size: 104px; line-height: 1.04; letter-spacing: -0.01em; font-weight: 700; }
  .headline .gold { color: #D4AF37; }
  .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 36px; line-height: 1.5; color: #CFC8B5; max-width: 760px; font-weight: 400; }
  .cta-row { display: flex; align-items: center; gap: 36px; }
  .cta {
    background: #D4AF37; color: #0E1013; font-family: system-ui, sans-serif;
    font-size: 34px; font-weight: 700; padding: 30px 52px; border-radius: 8px;
    letter-spacing: 0.02em;
  }
  .fine {
    font-family: system-ui, sans-serif; font-size: 26px; color: #9A927F;
  }
  .tag { position: absolute; top: 0; right: 0; border-left: 3px solid #C9A227; border-bottom: 3px solid #C9A227; padding: 22px 34px; color: #D4AF37; font-family: system-ui, sans-serif; font-size: 26px; letter-spacing: 0.18em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="ad">
    <div class="tag">Pikkaio Creative · Sample</div>
    <div class="topline">Wellness, simplified</div>
    <div class="headline">Feel lighter<br><span class="gold">by Friday.</span></div>
    <div class="sub">One capsule with your morning water. No 100-step routine, no willpower battle.</div>
    <div class="cta-row">
      <div class="cta">START THE 30-DAY TEST</div>
      <div class="fine">30-day bottle · free shipping</div>
    </div>
  </div>
</body>
</html>
