<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #14100C; }
  .ad {
    width: 1080px; height: 1080px; position: relative; overflow: hidden;
    background: radial-gradient(1200px 800px at 85% 110%, #241812 0%, #14100C 60%);
    font-family: Georgia, 'Times New Roman', serif; color: #F5EDDC;
    padding: 84px 80px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .topline {
    font-family: system-ui, -apple-system, sans-serif; font-size: 30px; letter-spacing: 0.42em;
    text-transform: uppercase; color: #D08A4F; font-weight: 600;
  }
  .headline { font-size: 100px; line-height: 1.04; font-weight: 700; }
  .headline .copper { color: #E0A061; }
  .sub { font-family: system-ui, sans-serif; font-size: 36px; line-height: 1.5; color: #D6CBB6; max-width: 820px; font-weight: 400; }
  .cta-row { display: flex; align-items: center; gap: 36px; }
  .cta {
    background: #E0A061; color: #14100C; font-family: system-ui, sans-serif;
    font-size: 34px; font-weight: 700; padding: 30px 52px; border-radius: 8px;
  }
  .fine { font-family: system-ui, sans-serif; font-size: 26px; color: #A99C84; }
  .bar { display: flex; align-items: center; gap: 24px; }
  .meter { width: 420px; height: 18px; background: #2A2018; border-radius: 999px; overflow: hidden; }
  .fill { width: 86%; height: 100%; background: #E0A061; border-radius: 999px; }
  .count { font-family: system-ui, sans-serif; font-size: 26px; color: #D6CBB6; }
</style>
</head>
<body>
  <div class="ad">
    <div class="topline">First batch, sealed monthly</div>
    <div class="headline">This month's run<br><span class="copper">is almost gone.</span></div>
    <div class="sub">We make one batch a month. When it's gone, you wait for the next.</div>
    <div class="cta-row">
      <div class="cta">CLAIM YOURS</div>
      <div class="fine">Ships in 24h · cancel anytime</div>
    </div>
    <div class="bar">
      <div class="meter"><div class="fill"></div></div>
      <div class="count">86% of the batch claimed</div>
    </div>
  </div>
</body>
</html>
